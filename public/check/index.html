<link rel="manifest" href="/check/manifest.webmanifest">

<style>
:root{color-scheme:light;--ink:#111;--navy:#111d2e;--muted:#5b667a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:#fff;color:var(--ink);
  font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
  -webkit-tap-highlight-color:transparent;
}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 원본 벡터 글자 자체를 초성→중성→종성 순으로 재조합해 실제 한글 입력처럼 보여줍니다. */
.type{width:min(92vw,760px)}
.type svg{display:block;margin-left:auto;margin-right:auto;height:auto;overflow:visible}
.type .part{
  fill:var(--ink);
  fill-rule:evenodd;
  opacity:0;
  transform-box:view-box;
  transform-origin:0 0;
  transition:opacity .055s linear,transform .075s cubic-bezier(.2,.8,.2,1);
}
.type .part.on{opacity:1}
.type .caret{fill:var(--ink);opacity:0}
.type .caret.live{animation:breathe 1.05s steps(1,end) infinite}
@keyframes breathe{0%,48%{opacity:.9}49%,100%{opacity:.18}}

.actions{
  margin-top:clamp(28px,6vh,56px);width:min(340px,100%);
  opacity:0;transform:translateY(8px);pointer-events:none;
  transition:opacity .5s ease,transform .5s ease;
}
.actions.show{opacity:1;transform:none;pointer-events:auto}
.start{
  display:flex;align-items:center;justify-content:center;
  min-height:56px;border-radius:14px;
  background:var(--navy);color:#fff;text-decoration:none;
  font-size:18px;font-weight:800;
}
.start:hover{opacity:.92}
.start:focus-visible,.skip:focus-visible{outline:3px solid #2563a8;outline-offset:3px}

.skip{
  position:fixed;right:max(16px,env(safe-area-inset-right));
  top:max(14px,env(safe-area-inset-top));
  min-height:44px;padding:0 14px;border:0;background:none;
  color:var(--muted);font:inherit;font-size:14px;font-weight:700;cursor:pointer;
}
.skip[hidden]{display:none}

@media (prefers-reduced-motion:reduce){
  .type .part{transition:none}
  .type .caret.live{animation:none;opacity:.6}
  .actions{transition:none}
}
</style>
</head>

  const SOURCE = ["안녕하세요.", "법인차량 자가점검", "시작할까요?"];

  const NS = "http://www.w3.org/2000/svg";
  const host = document.getElementById("type");
  const actions = document.getElementById("actions");
  const skipBtn = document.getElementById("skip");
  const startBtn = document.getElementById("start");
  startBtn.setAttribute("href", NEXT_URL);

  const el = (tag, attrs) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  };

  /* ===== 줄마다 SVG, 글자 조각, 입력 위치 표시 만들기 ===== */
  const rows = LINES.map((ln, i) => {
    const svg = el("svg", { viewBox: "0 0 " + ln.w + " " + ln.h });
    svg.style.width = ln.wp + "%";
    if (i > 0) svg.style.marginTop = ln.gap + "%";

    const glyphs = ln.g.map((g, gi) => {
      const parts=g[1].map(s => {
        const p = el("path", { d: s[0], "class": "part" });
        svg.appendChild(p);
        return { el: p, right: s[1], n: s[2] };
      });

      return{
        ch:g[0],
        parts,
        index:gi,
        slotLeft:gi===0 ? 0 : Number(ln.g[gi-1][1][ln.g[gi-1][1].length-1][1]||0)+2,
        slotRight:Number(parts[parts.length-1]?.right||0)
      };
    });

    const caret = el("rect", { "class": "caret", x: 9, y: 2, width: 5, height: ln.h - 4 });
    svg.appendChild(caret);
    host.appendChild(svg);
    return { svg, glyphs, caret, w: ln.w };
  });

  /* ===== 실제 한글 입력처럼 보이는 타이핑 =====
     완성형 글자를 새 폰트로 덮어쓰지 않고,
     이미 들어있는 원본 SVG의 초성/중성/종성 벡터를 그대로 사용합니다.

     예: "안"
       1) ㅇ 벡터만 글자 칸 중앙에 표시
       2) ㅇ+ㅏ 벡터를 함께 표시하고 다시 중앙 정렬
       3) ㅇ+ㅏ+ㄴ 전체를 원래 위치에 정착

     따라서 입력 중간에도 최종 글씨와 같은 디자인을 유지합니다. */

  const events=[];
  let clock=START_DELAY;

  rows.forEach((r,ri)=>{
    let gi=0;

    for(const ch of SOURCE[ri]){
      if(ch===" "){
        clock+=SPACE_PAUSE;
        continue;
      }

      const gl=r.glyphs[gi++];

      for(let stage=1;stage<=gl.parts.length;stage++){
        const at=clock;
        events.push({
          t:at,
          fn:()=>showCompositionStage(r,gl,stage)
        });
        clock+=KEY_DELAY;
      }

      clock+=LETTER_SETTLE;
    }

    events.push({
      t:clock,
      fn:()=>{
        if(ri<rows.length-1)hideCaret(r);
      }
    });

    clock+=LINE_PAUSE;
  });

  const TOTAL=clock;

  function showCompositionStage(r,glyph,stage){
    rows.forEach(o=>{if(o!==r)hideCaret(o)});

    glyph.parts.forEach((part,i)=>{
      if(i<stage){
        part.el.classList.add("on");
      }else{
        part.el.classList.remove("on");
      }
    });

    const visible=glyph.parts.slice(0,stage);
    const complete=stage>=glyph.parts.length;

    let dx=0;

    if(!complete && visible.length){
      const boxes=visible.map(p=>{
        try{return p.el.getBBox()}catch{return null}
      }).filter(Boolean);

      if(boxes.length){
        const minX=Math.min(...boxes.map(b=>b.x));
        const maxX=Math.max(...boxes.map(b=>b.x+b.width));
        const currentCenter=(minX+maxX)/2;

        const slotLeft=Number(glyph.slotLeft||0);
        const slotRight=Number(glyph.slotRight||slotLeft);
        const targetCenter=(slotLeft+slotRight)/2;

        dx=targetCenter-currentCenter;
      }
    }

    glyph.parts.forEach((part,i)=>{
      if(i<stage){
        part.el.style.transform=complete ? "translateX(0px)" : `translateX(${dx}px)`;
      }else{
        part.el.style.transform="translateX(0px)";
      }
    });

    if(CARET){
      const visibleRight=complete
        ? Number(glyph.slotRight||0)
        : Math.min(
            Number(glyph.slotRight||0),
            Number(visible[visible.length-1]?.right||glyph.slotRight||0)+dx
          );

      r.caret.setAttribute("x",String(visibleRight+5));
      r.caret.classList.add("live");
      r.caret.style.opacity="";
    }
  }

  function hideCaret(r) {
    r.caret.classList.remove("live");
    r.caret.style.opacity = "0";
  }

  let done = false, timer = 0, next = 0, t0 = 0;

  function finish() {
    if (done) return;
    done = true;
    clearTimeout(timer);
    rows.forEach(r=>r.glyphs.forEach(g=>g.parts.forEach(p=>{
      p.el.classList.add("on");
      p.el.style.transform="translateX(0px)";
    })));
    if (CARET) {
      rows.forEach(hideCaret);
      const last = rows[rows.length - 1];
      const lg = last.glyphs[last.glyphs.length - 1];
      last.caret.setAttribute("x", String(lg.parts[lg.parts.length - 1].right + 5));
      last.caret.classList.add("live");
      last.caret.style.opacity = "";
    }
    skipBtn.hidden = true;
    actions.classList.add("show");
  }

  function run() {
    if (done) return;
    const now = performance.now() - t0;
    while (next < events.length && events[next].t <= now) events[next++].fn();
    if (now >= TOTAL || next >= events.length && now >= TOTAL) { finish(); return; }
    const wait = next < events.length ? Math.max(8, events[next].t - now) : Math.max(8, TOTAL - now);
    timer = setTimeout(run, wait);
  }

  skipBtn.addEventListener("click", e => { e.stopPropagation(); finish(); });
  document.body.addEventListener("click", e => {
    if (!done && !e.target.closest("a")) finish();
  });

  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    finish();
  } else {
    t0 = performance.now();
    timer = setTimeout(run, 8);
  }
})();
